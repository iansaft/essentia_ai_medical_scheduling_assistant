[project]
name = "essentia-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Ian Saft", email = "iansaft.dev@gmail.com" }]
requires-python = ">=3.14.7"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "sqlc-bin>=1.31.1.post1",
    "testcontainers[postgres]>=4.15.0",
]
