services:
  postgres:
    image: postgres:18.4-alpine3.24
    container_name: ${PG_CNAME:-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_SUPERUSER}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PW}
      POSTGRES_DB: ${PG_DEFAULT_DB:-postgres}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - ${PG_DATA_FOLDER:-./.docker/postgres}/postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - essentia_ai_assistent_net
  
  migrations:
    image: ${GOLANG_MIGRATE_IMAGE:-migrate/migrate:v4.20.1}
    container_name: ${GOLANG_MIGRATE_CNAME:-golang_migrate}
    restart: "no"
    volumes:
      - ${MIGRATIONS_PATH}:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -path=/migrations
      - -database=postgres://${PG_SUPERUSER}:${PG_SUPERUSER_PW}@${PG_CNAME}:${PG_PORT}/${PG_DEFAULT_DB}?sslmode=${PG_SUPERUSER_SSL_MODE}
      - up
    networks:
      - essentia_ai_assistent_net

  seeds:
    image: ${GOLANG_MIGRATE_IMAGE:-migrate/migrate:v4.20.1}
    container_name: ${GOLANG_MIGRATE_CNAME:-essentia_ai_golang_migrate}_seeds
    restart: "no"
    volumes:
      - ${SEEDS_PATH}:/seeds:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
    command:
      - -path=/seeds
      - -database=postgres://${PG_SUPERUSER}:${PG_SUPERUSER_PW}@${PG_CNAME}:${PG_PORT}/${PG_DEFAULT_DB}?sslmode=${PG_SUPERUSER_SSL_MODE}&x-migrations-table=seed_migrations
      - up
    networks:
      - essentia_ai_assistent_net

  redis:
    image: ${REDIS_IMAGE:-redis:8.10.2-alpine3.23}
    container_name: ${REDIS_CNAME:-essentia_ai_assistent_redis}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    command:
      - /bin/sh
      - -c
      - >
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --appendfsync everysec
        --maxmemory "$${REDIS_MAXMEMORY:-256mb}"
        --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${REDIS_DATA_FOLDER:-./.docker/redis}/redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - essentia_ai_assistent_net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ${API_CNAME:-essentia_ai_assistent_api}
    restart: unless-stopped
    environment:
      API_ENV: ${NODE_ENV:-development}
      API_HOST: ${API_HOST:-127.0.0.1}
      API_PORT: ${API_PORT:-8000}
      API_DB_HOST: ${API_DB_HOST:-postgres}
      API_DB_PORT: ${API_DB_PORT:-5432}
      API_DB_NAME: ${API_DB_NAME:-postgres}
      API_DB_USER: ${API_DB_USER}
      API_DB_PW: ${API_DB_PW}
      API_DB_SSL_MODE: ${PG_SUPERUSER_SSL_MODE:-disable}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
      API_REDIS_HOST: ${API_REDIS_HOST:-redis}
      API_REDIS_PORT: ${API_REDIS_PORT:-6379}
      API_REDIS_PASSWORD: ${API_REDIS_PASSWORD}
      API_REDIS_DB: ${API_REDIS_DB:-0}
      API_REDIS_SOCKET_TIMEOUT: ${API_REDIS_SOCKET_TIMEOUT:-2}
      API_REDIS_CONNECT_TIMEOUT: ${API_REDIS_CONNECT_TIMEOUT:-2}
      AVAILABILITY_CACHE_ENABLED: ${AVAILABILITY_CACHE_ENABLED:-true}
      AVAILABILITY_CACHE_TTL_SECONDS: ${AVAILABILITY_CACHE_TTL_SECONDS:-30}
      AVAILABILITY_CACHE_TTL_JITTER_SECONDS: ${AVAILABILITY_CACHE_TTL_JITTER_SECONDS:-10}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Sao_Paulo}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://localhost:4173,http://localhost:8080}
      API_N8N_BASE_URL: http://n8n:5678
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      seeds:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://${API_HOST}:${API_PORT}/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - essentia_ai_assistent_net

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.39.10}
    container_name: ${N8N_CNAME:-essentia_ai_assistent_n8n}
    restart: unless-stopped
    environment:
      NODE_ENV: ${N8N_NODE_ENV:-production}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_LISTEN_ADDRESS: ${N8N_LISTEN_ADDRESS:-0.0.0.0}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-America/Sao_Paulo}
      TZ: ${N8N_TIMEZONE:-America/Sao_Paulo}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: ${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
      N8N_RUNNERS_ENABLED: ${N8N_RUNNERS_ENABLED:-true}
      DB_TYPE: sqlite
      DB_SQLITE_POOL_SIZE: ${DB_SQLITE_POOL_SIZE:-4}
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - ${N8N_DATA_FOLDER:-./.docker/n8n}/n8n_data:/home/node/.n8n
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz/readiness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - essentia_ai_assistent_net
  
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_N8N_CHAT_WEBHOOK_URL: ${VITE_N8N_CHAT_WEBHOOK_URL}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: ${WEB_CNAME:-essentia_ai_assistent_web}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - essentia_ai_assistent_net

volumes:
  postgres_data:
  n8n_data:

networks:
  essentia_ai_assistent_net:
    driver: bridge
    name: essentia_ai_assistent_net